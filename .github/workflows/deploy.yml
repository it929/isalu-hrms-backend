name: Simple Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment..."
            
            # Create directories
            sudo mkdir -p /var/www/isalu-hrms-backend/bootstrap/cache
            sudo mkdir -p /var/www/isalu-hrms-backend/storage/framework/{sessions,views,cache}
            sudo chmod -R 775 /var/www/isalu-hrms-backend/bootstrap
            sudo chmod -R 775 /var/www/isalu-hrms-backend/storage
            
            # Deploy Backend
            echo "📦 Deploying backend..."
            cd /var/www/isalu-hrms-backend
            git fetch origin
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo systemctl restart laravel-api
            
            # Deploy Frontend
            if [ -d "/var/www/isalu-hrms-frontend" ]; then
              echo "🎨 Deploying frontend..."
              cd /var/www/isalu-hrms-frontend
              git fetch origin
              git reset --hard origin/main
              npm install --production
              npm run build
              pm2 restart isalu-frontend
            fi
            
            # Reload Nginx
            sudo systemctl reload nginx
            
            echo "✅ Deployment completed successfully!"
            echo "🌐 Application: http://192.168.2.9"
